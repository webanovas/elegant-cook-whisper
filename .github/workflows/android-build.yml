name: Build Android AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Fallback Web Dir
        run: |
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>CookNotes</title></head>
          <body style="margin:0;background:#faf7f2"></body></html>
          HTML

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android


      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.keystore

      - name: Configure Gradle Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore
          RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$KEY_ALIAS
          RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()

          # Pin versionCode / versionName for Google Play releases
          s = re.sub(r"versionCode\s+\d+", "versionCode 2", s)
          s = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.1"', s)

          if "RELEASE_STORE_FILE" not in s:
              signing = "\n".join([
                  "",
                  "    signingConfigs {",
                  "        release {",
                  "            storeFile file(project.property(\"RELEASE_STORE_FILE\"))",
                  "            storePassword project.property(\"RELEASE_STORE_PASSWORD\")",
                  "            keyAlias project.property(\"RELEASE_KEY_ALIAS\")",
                  "            keyPassword project.property(\"RELEASE_KEY_PASSWORD\")",
                  "        }",
                  "    }",
                  "",
              ])
              s = re.sub(r"(android\s*\{)", lambda m: m.group(1) + signing, s, count=1)
              s = re.sub(r"(buildTypes\s*\{\s*release\s*\{)",
                         lambda m: m.group(1) + "\n            signingConfig signingConfigs.release",
                         s, count=1)
              print("signing config injected")

          p.write_text(s)
          print("versionCode/Name patched")
          PY


      - name: Build Signed Android App Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify Signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary "$AAB" | tail -5

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

